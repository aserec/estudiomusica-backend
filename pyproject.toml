[project]
name = "estudiomusica-backend"
version = "0.1.0"
description = "Backend FastAPI de EstudioMusica"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "fastapi[standard]==0.162.0",
    "pydantic-settings==2.16.1",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.17.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py315"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q"]

[tool.mypy]
python_version = "3.15"
strict = true
packages = ["app", "tests"]
plugins = ["pydantic.mypy"]
