services:
  postgres:
    image: postgres:17-alpine
    container_name: estudiomusica-postgres
    environment:
      POSTGRES_USER: estudiomusica
      POSTGRES_PASSWORD: estudiomusica
      POSTGRES_DB: estudiomusica
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estudiomusica -d estudiomusica"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
